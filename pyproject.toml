[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my-strands-agents"
version = "0.1.0"
description = "AI-powered code review agents using the Strands Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
code-review = "my_strands_agents.code_review.agent:main"
strands-agent = "my_strands_agents.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_strands_agents*"]

[tool.setuptools.package-data]
"my_strands_agents" = ["prompts/*.prompt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
